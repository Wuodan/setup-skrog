# Dependabot for the CI actions (wslkit/skrog#294).
#
# Actions only: this repository is a composite action driving PowerShell, with
# no package manager and no lockfile. Renovate manages the action's pinned
# default Skrog release separately.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    labels: [dependencies]
    commit-message:
      prefix: ci
